id: aegis-debug-endpoint
info:
  name: AegisAI Lab - Exposed Debug Endpoint
  author: aegis-ai
  severity: high
  description: Unauthenticated debug endpoint discloses secrets and environment.
  tags: aegis,exposure,debug
requests:
  - method: GET
    path:
      - "{{BaseURL}}/debug"
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        words:
          - "debug_token"
          - "admin_password"
        condition: or
